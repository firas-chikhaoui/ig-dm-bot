<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ig-dm-bot · dashboard</title>
<style>
  :root { --bg:#0b0b0f; --panel:#15151c; --line:#26262f; --text:#f2f2f5; --muted:#8b8b99;
          --accent:#ff3d7f; --ok:#2ecc71; --warn:#f5a623; --bad:#ff4d4f; --bar:#3b5bfd; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:18px 28px; border-bottom:1px solid var(--line); display:flex; gap:16px;
           align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1; }
  header h1 span { color:var(--muted); font-weight:400; }
  button, .btn { background:none; border:1px solid var(--line); color:var(--text); border-radius:8px;
           padding:7px 12px; cursor:pointer; font:inherit; font-size:13px; text-decoration:none; }
  button.primary { background:var(--accent); border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  input { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px;
          padding:9px 12px; font:inherit; width:100%; }
  main { max-width:1080px; margin:0 auto; padding:28px 20px 60px; }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .kpi .v { font-size:28px; font-weight:650; margin-top:4px; }
  .kpi .l { color:var(--muted); font-size:13px; }
  h2 { font-size:14px; color:var(--muted); font-weight:500; margin:28px 0 10px;
       text-transform:uppercase; letter-spacing:.06em; }
  .row { display:flex; gap:14px; flex-wrap:wrap; } .row > div { flex:1; min-width:280px; }
  .chart { display:flex; align-items:flex-end; gap:6px; height:160px; padding-top:10px; }
  .chart .col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%;
                justify-content:flex-end; }
  .chart .b { width:100%; max-width:34px; background:var(--bar); border-radius:5px 5px 2px 2px;
              min-height:2px; }
  .chart .d { color:var(--muted); font-size:11px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { text-align:left; padding:7px 4px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; }
  .muted { color:var(--muted); font-size:13px; }
  #msg { margin-left:8px; font-size:13px; color:var(--muted); }
  .hidden { display:none !important; }
  .tag { display:inline-block; font-size:11px; color:var(--muted); border:1px solid var(--line);
         border-radius:6px; padding:1px 6px; margin-left:6px; }
  .acts { white-space:nowrap; text-align:right; } .acts button { padding:5px 10px; }
  .scroll { overflow-x:auto; }
  #accounts td { vertical-align:middle; }
  #accounts a.pick { color:inherit; text-decoration:none; cursor:pointer; }
  #accounts tr.sel td { background:rgba(255,61,127,.06); }
  select { background:var(--panel); color:var(--text); border:1px solid var(--line);
           border-radius:8px; padding:7px 10px; font:inherit; font-size:13px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); }
  .bar-head { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .bar-head .sp { flex:1; }
  .kpi .s { color:var(--muted); font-size:12px; margin-top:2px; }
  #accChart { gap:3px; } #accChart .d { font-size:10px; }
</style>
</head>
<body>
<header>
  <h1>📩 ig-dm-bot <span>· dashboard</span></h1>
  <span id="updated" class="muted"></span>
  <button id="reload">↻ Refresh</button>
  <form method="post" action="/admin/logout" style="margin:0"><button id="logout" type="submit">Log out</button></form>
</header>

<main id="app">
  <div class="grid" id="kpis"></div>

  <h2>Activity · last 14 days</h2>
  <div class="card"><div class="chart" id="chart"></div>
    <div class="muted" style="margin-top:8px">Flows started per day</div></div>

  <h2>Instagram accounts <span id="accSummary" style="text-transform:none;letter-spacing:0"></span></h2>
  <div class="card scroll">
    <table id="accounts"><tr><td class="muted">Loading…</td></tr></table>
    <div id="accMsg" class="muted" style="margin-top:8px"></div>
  </div>

  <h2>Stats per account · last 30 days</h2>
  <div class="card">
    <div class="bar-head">
      <select id="statsAccount" aria-label="Account"></select>
      <span class="sp"></span>
      <div class="tabs" id="metricTabs"></div>
    </div>
    <div class="grid" id="accKpis"></div>
    <div class="chart" id="accChart" style="margin-top:14px"></div>
    <div class="muted" id="accChartLabel" style="margin-top:8px"></div>
  </div>

  <h2>Top flows</h2>
  <div class="card"><table id="flows"><tr><th>Flow</th><th>Started</th></tr></table></div>

  <h2>Actions</h2>
  <div class="card">
    <button id="csv">⬇ Download emails (CSV)</button>
    <button id="testAlert">🚨 Send test alert</button>
    <button id="connect">➕ Connect Instagram account</button>
    <span id="msg"></span>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// The session cookie (HttpOnly) is sent automatically; it expires or you log out -> login page.
function toLogin() { window.location.href = "/admin/login?next=/admin"; }

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: "same-origin", ...opts });
  if (r.status === 401) { toLogin(); throw new Error("unauthorized"); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
  return body;
}

const KPIS = [
  ["flow_started", "Flows started"], ["comment_reply", "Comment replies"],
  ["button", "Button clicks"], ["emails", "Emails collected"],
  ["follow_check", "Follow checks"], ["follow_gave_up", "Gave up (no follow)"],
];

function renderStats(s) {
  $("kpis").innerHTML = KPIS.map(([k, l]) =>
    `<div class="card kpi"><div class="l">${l}</div><div class="v">${(s.stats[k] || 0).toLocaleString()}</div></div>`
  ).join("") + `<div class="card kpi"><div class="l">Reel rules · flows</div>
    <div class="v">${s.reels} · ${s.flows.length}</div></div>`;
}

function renderActivity(a) {
  const vals = a.days.map(d => d.counts.flow_started || 0);
  const max = Math.max(1, ...vals);
  $("chart").innerHTML = a.days.map((d, i) =>
    `<div class="col" title="${esc(d.date)}: ${vals[i]} flow(s) started">
       <div class="muted" style="font-size:11px">${vals[i] || ""}</div>
       <div class="b" style="height:${(vals[i] / max) * 100}%"></div>
       <div class="d">${esc(d.date.slice(8))}.${esc(d.date.slice(5, 7))}</div></div>`).join("");
  const rows = a.top_flows.map(f =>
    `<tr><td>${esc(f.flow)}</td><td>${f.started.toLocaleString()}</td></tr>`).join("");
  $("flows").innerHTML = `<tr><th>Flow</th><th>Started</th></tr>` +
    (rows || `<tr><td colspan="2" class="muted">No flows started yet</td></tr>`);
}

const HEALTH_COLOR = { ok: "var(--ok)", expiring: "var(--warn)", paused: "var(--muted)",
  error: "var(--bad)", expired: "var(--bad)", missing: "var(--bad)" };

function fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString() : "unknown"; }

function renderAccounts(d) {
  const head = `<tr><th>Account</th><th>Status</th><th>Token</th><th>Rules</th><th></th></tr>`;
  const rows = d.accounts.map(a => {
    const name = a.username ? "@" + esc(a.username) : esc(a.account_id);
    const days = a.days_left === null ? "expiry unknown"
      : a.days_left <= 0 ? "expired" : `${Math.floor(a.days_left)} days left`;
    const when = [a.expires_at ? "until " + fmtDate(a.expires_at) : "",
                  a.refreshed_at ? "refreshed " + fmtDate(a.refreshed_at) : ""].filter(Boolean).join(" · ");
    const token = `${days}${when ? `<div class="muted">${esc(when)}</div>` : ""}`;
    const err = a.last_error ? `<div class="muted" title="${esc(a.last_error)}">⚠ ${esc(a.last_error.slice(0, 60))}</div>` : "";
    const toggle = a.source === "database"
      ? (a.active ? `<button data-act="pause" data-id="${esc(a.account_id)}">⏸ Pause</button>`
                  : `<button data-act="resume" data-id="${esc(a.account_id)}" class="primary">▶ Resume</button>`)
      : "";
    return `<tr data-id="${esc(a.account_id)}">
      <td><a class="pick" data-pick="${esc(a.account_id)}" title="Show stats"><b>${name}</b></a>${a.is_default ? '<span class="tag">.env</span>' : ""}
        <div class="muted">ID ${esc(a.account_id)}${a.connected_at ? " · since " + esc(fmtDate(a.connected_at)) : ""}</div></td>
      <td><span class="dot" style="background:${HEALTH_COLOR[a.health] || "var(--muted)"}"></span>${esc(a.health_label)}${err}</td>
      <td>${token}</td>
      <td>${a.rules === "database" ? "own rules" : "rules.yaml"}</td>
      <td class="acts">${toggle}
        <button data-act="refresh" data-id="${esc(a.account_id)}" ${a.active ? "" : "disabled"} title="Refresh the token now">🔑</button></td>
    </tr>`;
  }).join("");
  $("accounts").innerHTML = head + (rows ||
    `<tr><td colspan="5" class="muted">No account yet. Set IG_ACCESS_TOKEN in .env or click ➕ Connect Instagram account.</td></tr>`);
  const n = d.accounts.length, paused = d.summary.paused || 0;
  const issues = (d.summary.error || 0) + (d.summary.expired || 0) + (d.summary.missing || 0) + (d.summary.expiring || 0);
  $("accSummary").textContent = `· ${n} connected` + (paused ? ` · ${paused} paused` : "") +
    (issues ? ` · ${issues} need attention` : "");
}

async function accountAction(btn) {
  const id = btn.dataset.id, act = btn.dataset.act;
  if (act === "pause" && !confirm(`Pause account ${id}? The bot stops answering its comments and DMs until you resume it.`)) return;
  await action(btn, async () => {
    if (act === "refresh") {
      const r = await api(`/admin/token/refresh?account=${encodeURIComponent(id)}`, { method: "POST" });
      await loadAccounts();
      return r.refreshed ? "✅ Token refreshed" : "⚠ Refresh failed, see logs";
    }
    await api(`/admin/accounts/${encodeURIComponent(id)}/${act}`, { method: "POST" });
    await loadAccounts();
    return act === "pause" ? `⏸ Account ${id} paused` : `▶ Account ${id} resumed`;
    }, $("accMsg"));
}

// --- Stats per account -------------------------------------------------------
const METRICS = [["matches", "Matches", "Flows started by a comment or DM keyword"],
                 ["dms", "DMs sent", "Messages the bot sent"],
                 ["clicks", "Button clicks", "Buttons tapped in DMs"],
                 ["emails", "Emails", "Email addresses collected"]];
let statsAccount = null, metric = "matches", accStats = null;

function accountName(a) { return a.username ? "@" + a.username : a.account_id; }

function renderStatsPicker(accounts) {
  if (!accounts.some(a => a.account_id === statsAccount)) statsAccount = accounts[0]?.account_id ?? null;
  $("statsAccount").innerHTML = accounts.map(a =>
    `<option value="${esc(a.account_id)}" ${a.account_id === statsAccount ? "selected" : ""}>${esc(accountName(a))}</option>`
  ).join("") || `<option value="">No account</option>`;
  document.querySelectorAll("#accounts tr[data-id]").forEach(tr =>
    tr.classList.toggle("sel", tr.dataset.id === statsAccount));
}

function renderAccStats() {
  $("metricTabs").innerHTML = METRICS.map(([k, l]) =>
    `<button data-metric="${k}" class="${k === metric ? "on" : ""}">${l}</button>`).join("");
  if (!accStats) {
    $("accKpis").innerHTML = ""; $("accChart").innerHTML = "";
    $("accChartLabel").textContent = statsAccount ? "Loading…" : "No account connected yet.";
    return;
  }
  $("accKpis").innerHTML = METRICS.map(([k, l]) =>
    `<div class="card kpi"><div class="l">${l}</div><div class="v">${(accStats.last_days[k] || 0).toLocaleString()}</div>
       <div class="s">${(accStats.totals[k] || 0).toLocaleString()} all time</div></div>`).join("");
  const vals = accStats.days.map(d => d[metric] || 0);
  const max = Math.max(1, ...vals);
  $("accChart").innerHTML = accStats.days.map((d, i) =>
    `<div class="col" title="${esc(d.date)}: ${vals[i]}">
       <div class="b" style="height:${(vals[i] / max) * 100}%"></div>
       <div class="d">${i % 5 === 4 || i === vals.length - 1 ? esc(d.date.slice(8)) + "." + esc(d.date.slice(5, 7)) : "&nbsp;"}</div></div>`).join("");
  const m = METRICS.find(x => x[0] === metric);
  $("accChartLabel").textContent = `${m[2]} per day (UTC) · ${vals.reduce((a, b) => a + b, 0).toLocaleString()} in 30 days`;
}

async function loadAccStats() {
  if (!statsAccount) { accStats = null; renderAccStats(); return; }
  const id = statsAccount;
  const d = await api(`/admin/accounts/${encodeURIComponent(id)}/stats?days=30`);
  if (id === statsAccount) { accStats = d; renderAccStats(); }
}

function selectAccount(id) {
  if (id === statsAccount) return;
  statsAccount = id; accStats = null;
  document.querySelectorAll("#accounts tr[data-id]").forEach(tr => tr.classList.toggle("sel", tr.dataset.id === id));
  $("statsAccount").value = id;
  renderAccStats();
  loadAccStats().catch(e => { $("accChartLabel").textContent = "⚠ " + e.message; });
}

async function loadAccounts() {
  const d = await api("/admin/accounts");
  renderAccounts(d); renderStatsPicker(d.accounts);
}

async function load() {
  try {
    const [s, a, acc] = await Promise.all([api("/admin/stats"), api("/admin/activity"), api("/admin/accounts")]);
    renderStats(s); renderActivity(a); renderAccounts(acc); renderStatsPicker(acc.accounts);
    await loadAccStats();
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) {
    if (e.message !== "unauthorized") $("updated").textContent = "⚠ " + e.message;
  }
}

async function action(btn, fn, out = $("msg")) {
  btn.disabled = true; out.textContent = "…";
  try { out.textContent = await fn(); } catch (e) { out.textContent = "⚠ " + e.message; }
  btn.disabled = false;
}

$("reload").onclick = load;
$("csv").onclick = async () => {
  const r = await fetch("/admin/emails.csv", { credentials: "same-origin" });
  if (r.status === 401) { toLogin(); return; }
  if (!r.ok) { $("msg").textContent = "⚠ download failed"; return; }
  const url = URL.createObjectURL(await r.blob());
  const a = Object.assign(document.createElement("a"), { href: url, download: "emails.csv" });
  a.click(); URL.revokeObjectURL(url);
};
$("statsAccount").onchange = (e) => selectAccount(e.target.value);
$("metricTabs").onclick = (e) => {
  const b = e.target.closest("button[data-metric]");
  if (b) { metric = b.dataset.metric; renderAccStats(); }
};
$("accounts").onclick = (e) => {
  const pick = e.target.closest("[data-pick]");
  if (pick) { selectAccount(pick.dataset.pick); $("statsAccount").scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  const btn = e.target.closest("button[data-act]");
  if (btn && !btn.disabled) accountAction(btn);
};
$("testAlert").onclick = (e) => action(e.target, async () => {
  await api("/admin/alerts/test", { method: "POST" });
  return "✅ Test alert sent to Telegram";
});

$("connect").onclick = (e) => action(e.target, async () => {
  const r = await api("/admin/connect", { method: "POST" });
  window.location.href = r.url;  // Instagram login, then back to /connect/callback
  return "Opening Instagram…";
});

renderAccStats();
load();
setInterval(() => { if (!document.hidden) load(); }, 60000);
</script>
</body>
</html>
