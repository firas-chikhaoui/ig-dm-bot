<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ig-dm-bot · playground</title>
<style>
  :root { --bg:#0b0b0f; --panel:#15151c; --line:#26262f; --text:#f2f2f5; --muted:#8b8b99;
          --me:#3b5bfd; --bot:#26262f; --accent:#ff3d7f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:18px 28px; border-bottom:1px solid var(--line); display:flex; gap:22px;
           align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0 12px 0 0; }
  header h1 span { color:var(--muted); font-weight:400; }
  label { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:8px; }
  input[type=text], select { background:var(--panel); color:var(--text); border:1px solid var(--line);
         border-radius:8px; padding:7px 10px; font:inherit; font-size:14px; }
  .toggle { position:relative; width:42px; height:24px; background:var(--line); border-radius:12px;
            cursor:pointer; transition:.2s; border:none; }
  .toggle::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px;
                   border-radius:50%; background:#fff; transition:.2s; }
  .toggle.on { background:#2ecc71; } .toggle.on::after { left:21px; }
  button.ghost { background:none; border:1px solid var(--line); color:var(--text); border-radius:8px;
                 padding:7px 12px; cursor:pointer; font:inherit; font-size:13px; }
  main { display:flex; gap:40px; justify-content:center; padding:32px 20px; flex-wrap:wrap; }
  .phone { width:360px; height:680px; background:#000; border:1px solid var(--line); border-radius:36px;
           padding:14px; display:flex; flex-direction:column; box-shadow:0 20px 60px #0008; }
  .screen { flex:1; background:var(--panel); border-radius:26px; overflow:hidden; display:flex;
            flex-direction:column; }
  .caption { text-align:center; color:var(--muted); font-size:12px; margin-bottom:10px;
             text-transform:uppercase; letter-spacing:.08em; }
  /* reel */
  .reel { height:270px; background:linear-gradient(135deg,#ff3d7f,#7b2ff7 55%,#1fb6ff);
          position:relative; display:flex; align-items:flex-end; padding:14px; }
  .reel .play { position:absolute; inset:0; display:grid; place-items:center; font-size:46px; opacity:.85; }
  .reel .cap { font-size:13px; text-shadow:0 1px 4px #0009; }
  .comments { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:12px; }
  .comment { display:flex; gap:10px; }
  .avatar { width:30px; height:30px; border-radius:50%; flex:none; display:grid; place-items:center;
            font-size:13px; font-weight:600; }
  .comment .who { font-weight:600; margin-right:6px; }
  .comment.reply { margin-left:38px; }
  .comment.reply .who { color:var(--accent); }
  .compose { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); }
  .compose input { flex:1; border-radius:20px; padding:9px 14px; }
  .compose button { background:none; border:none; color:#5b8cff; font-weight:600; cursor:pointer; font:inherit; }
  /* dm */
  .dmhead { padding:14px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  .dmhead small { color:var(--muted); display:block; font-size:12px; }
  .thread { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .bubble { max-width:80%; padding:9px 13px; border-radius:18px; white-space:pre-wrap; word-wrap:break-word;
            animation:pop .18s ease-out; }
  .bubble.bot { background:var(--bot); align-self:flex-start; border-bottom-left-radius:6px; }
  .bubble.me { background:var(--me); align-self:flex-end; border-bottom-right-radius:6px; }
  .card { align-self:flex-start; max-width:82%; background:var(--bot); border-radius:18px;
          border-bottom-left-radius:6px; overflow:hidden; animation:pop .18s ease-out; }
  .card .t { padding:10px 13px; white-space:pre-wrap; }
  .card button { display:block; width:100%; background:none; border:none; border-top:1px solid #3a3a46;
                 color:#5b8cff; padding:10px; font:inherit; font-weight:600; cursor:pointer; }
  .card button:hover { background:#ffffff0a; } .card button:disabled { color:var(--muted); cursor:default; }
  .bubble, .card, .note, .comment { flex-shrink:0; }
  .note { align-self:center; color:var(--muted); font-size:12px; text-align:center; padding:4px 10px; }
  .empty { margin:auto; color:var(--muted); text-align:center; font-size:13px; padding:20px; }
  .banner { background:rgba(255,61,127,.1); border-bottom:1px solid rgba(255,61,127,.35); padding:9px 28px;
            font-size:13px; }
  @keyframes pop { from { transform:scale(.92); opacity:0 } to { transform:none; opacity:1 } }
</style>
</head>
<body>
<header>
  <h1>🤖 ig-dm-bot <span>playground · dry run</span></h1>
  <label>Reel <select id="reel"></select></label>
  <label>You are @<input type="text" id="username" value="sara" size="10"></label>
  <label>Follows your account <button class="toggle" id="follows" aria-label="follows"></button></label>
  <button class="ghost" id="reset">↺ New follower</button>
</header>

<div class="banner" id="banner" hidden></div>

<main>
  <div>
    <div class="caption">① Comment on your reel</div>
    <div class="phone"><div class="screen">
      <div class="reel"><div class="play">▶</div><div class="cap" id="reelcap"></div></div>
      <div class="comments" id="comments"><div class="empty" id="hint"></div></div>
      <form class="compose" id="cform"><input type="text" id="ctext" placeholder="Add a comment…" autocomplete="off"><button>Post</button></form>
    </div></div>
  </div>
  <div>
    <div class="caption">② What lands in their DMs</div>
    <div class="phone"><div class="screen">
      <div class="dmhead"><div class="avatar" style="background:linear-gradient(135deg,#ff3d7f,#7b2ff7)">★</div>
        <div><b>your_account</b><small>Instagram DM</small></div></div>
      <div class="thread" id="thread"><div class="empty">No messages yet.<br>Comment a keyword on the left 👈</div></div>
      <form class="compose" id="dform"><input type="text" id="dtext" placeholder="Message…" autocomplete="off"><button>Send</button></form>
    </div></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let userId = "u" + Math.floor(Math.random() * 1e9);
let follows = false, reels = [];

// Which rules to run: the .env account (default), ?account=ID (its saved rules), or
// ?draft=1 (unsaved rules from the dashboard editor, kept in this browser only).
const params = new URLSearchParams(location.search);
const target = {};
if (params.get("account")) target.account = params.get("account");
if (params.get("draft") === "1") {
  try {
    const d = JSON.parse(localStorage.getItem("igdm.rulesDraft") || "null");
    if (d && typeof d.yaml === "string") { target.rules = d.yaml; if (d.account) target.account = d.account; }
  } catch { /* no browser storage: fall back to saved rules */ }
}
function showBanner() {
  const b = $("banner");
  if (target.rules !== undefined) b.textContent = "🧪 Testing unsaved rules from the dashboard editor" +
    (target.account ? ` (account ${target.account})` : "") + ". Save them in the dashboard to make them live.";
  else if (target.account) b.textContent = `Running the saved rules of account ${target.account}.`;
  else return;
  b.hidden = false;
}

$("follows").onclick = () => { follows = !follows; $("follows").classList.toggle("on", follows); };
$("reset").onclick = () => {
  userId = "u" + Math.floor(Math.random() * 1e9);
  $("comments").innerHTML = ""; $("thread").innerHTML =
    '<div class="empty">No messages yet.<br>Comment a keyword on the left 👈</div>';
  updateHint();
};
$("reel").onchange = updateHint;

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function initial(n) { return (n || "?")[0].toUpperCase(); }
function scroll(el) { el.scrollTop = el.scrollHeight; }
function clearEmpty(el) { el.querySelectorAll(".empty").forEach(e => e.remove()); }

function updateHint() {
  const r = reels[$("reel").selectedIndex]; if (!r) return;
  $("reelcap").textContent = r.name + (r.id === "*" ? " (any post)" : "");
  const c = $("comments");
  if (!c.querySelector(".comment")) c.innerHTML = '<div class="empty">Keywords for this reel: <b>' +
    (r.keywords.length ? r.keywords.map(esc).join(", ") : "any comment") + "</b></div>";
}

async function send(ev) {
  const res = await fetch("/playground/event", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...target, ...ev, user_id: userId, username: $("username").value.trim() || "test_user", follows }) });
  if (!res.ok) { alert("Error: " + await res.text()); return []; }
  return (await res.json()).messages;
}

function addComment(who, text, reply) {
  const c = $("comments"); clearEmpty(c);
  const color = reply ? "linear-gradient(135deg,#ff3d7f,#7b2ff7)" : "#3a3a46";
  c.insertAdjacentHTML("beforeend", `<div class="comment ${reply ? "reply" : ""}">
    <div class="avatar" style="background:${color}">${reply ? "★" : esc(initial(who))}</div>
    <div><span class="who">${esc(who)}</span>${esc(text)}</div></div>`);
  scroll(c);
}

function render(msgs) {
  const t = $("thread");
  for (const m of msgs) {
    if (m.type === "public_reply") { addComment("your_account", m.text, true); continue; }
    clearEmpty(t);
    if (!m.buttons.length) { t.insertAdjacentHTML("beforeend", `<div class="bubble bot">${esc(m.text)}</div>`); continue; }
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = `<div class="t">${esc(m.text)}</div>`;
    for (const b of m.buttons) {
      const btn = document.createElement("button");
      btn.textContent = b.url ? b.title + " ↗" : b.title;
      btn.onclick = async () => {
        if (b.url) { window.open(b.url, "_blank"); return; }
        t.insertAdjacentHTML("beforeend", `<div class="note">You tapped “${esc(b.title)}”</div>`); scroll(t);
        render(await send({ kind: "click", payload: b.payload }));
      };
      card.appendChild(btn);
    }
    t.appendChild(card);
  }
  scroll(t);
}

$("cform").onsubmit = async e => {
  e.preventDefault(); const text = $("ctext").value.trim(); if (!text) return;
  $("ctext").value = ""; addComment($("username").value.trim() || "test_user", text, false);
  const r = reels[$("reel").selectedIndex];
  const msgs = await send({ kind: "comment", text, media_id: r && r.id !== "*" ? r.id : "any-post" });
  if (!msgs.length) { const c = $("comments");
    c.insertAdjacentHTML("beforeend", '<div class="note">No reply: no keyword matched, or this follower already got the DM for this reel.</div>'); scroll(c); }
  render(msgs);
};

$("dform").onsubmit = async e => {
  e.preventDefault(); const text = $("dtext").value.trim(); if (!text) return;
  $("dtext").value = ""; const t = $("thread"); clearEmpty(t);
  t.insertAdjacentHTML("beforeend", `<div class="bubble me">${esc(text)}</div>`); scroll(t);
  render(await send({ kind: "dm", text }));
};

showBanner();
const infoReq = target.rules !== undefined
  ? fetch("/playground/info", { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(target) })
  : fetch("/playground/info" + (target.account ? "?account=" + encodeURIComponent(target.account) : ""));
infoReq.then(async r => {
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
  return r.json();
}).then(info => {
  reels = info.reels;
  $("reel").innerHTML = reels.map(r => `<option>${esc(r.name)}</option>`).join("");
  updateHint();
}).catch(e => { const b = $("banner"); b.textContent = "⚠ " + e.message; b.hidden = false; });
</script>
</body>
</html>
